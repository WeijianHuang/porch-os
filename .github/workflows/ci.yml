name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          files=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$files" ]; then
            echo "::error::以下文件未按 gofmt 格式化："
            echo "$files"
            exit 1
          fi
          echo "OK: gofmt clean"

      - name: Test
        run: go test ./... -race -count=1

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          test -f .env.example
          test -f CONTRIBUTING.md
          test -f go.mod

      - name: No secrets or real data committed
        run: |
          matches=$(git ls-files \
            | grep -v -E '(^|/)\.env\.example$' \
            | grep -E '(^|/)(\.env$|\.env\..+|.*\.pem$|.*\.key$|.*\.p12$|.*\.dump$|.*\.sql\.gz$|backups/|snapshots/|secrets/)' || true)
          if [ -n "$matches" ]; then
            echo "::error::发现疑似密钥或真实数据文件被提交："
            echo "$matches"
            exit 1
          fi
          echo "OK: no secrets or data exports tracked"
